<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>George Efesopoulos - Portfolio Playground</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <!-- Canvas for the world -->
    <canvas id="world-canvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-overlay">
        <!-- Tutorial/Intro -->
        <div id="tutorial" class="ui-panel hidden">
            <div class="tutorial-content">
                <h2>Welcome to the Playground</h2>
                <p id="tutorial-text">Use <span id="controls-hint">arrow keys or WASD</span> to move around.</p>
                <p>Meet <strong>The Guide</strong> - he'll help you explore.</p>
                <button id="start-btn">Begin</button>
            </div>
        </div>

        <!-- Thought Bubble from The Guide -->
        <div id="guide-comment" class="hidden"></div>

        <!-- Action Menu (Click on character) -->
        <div id="action-menu" class="context-menu hidden">
            <button id="send-message-btn" class="menu-item">
                💬 Send Message
            </button>
        </div>

        <!-- Customize Menu (Right-click on character) -->
        <div id="customize-menu" class="context-menu hidden">
            <div class="menu-header">Customize Responses</div>
            <div id="responses-list" class="responses-list"></div>
            <button id="add-response-btn" class="menu-item add-btn">
                + Add Response
            </button>
        </div>

        <!-- Message Prompt Dialog -->
        <div id="message-prompt" class="dialog hidden">
            <div class="dialog-content">
                <h3>Message The Guide</h3>
                <input type="text" id="message-input" placeholder="Type your message..." autofocus>
                <div class="dialog-actions">
                    <button id="message-send-btn" class="btn-primary">Send</button>
                    <button id="message-cancel-btn" class="btn-secondary">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Response Dialog -->
        <div id="response-dialog" class="dialog hidden">
            <div class="dialog-content">
                <h3>Add Custom Response</h3>
                <textarea id="response-input" placeholder="Enter a response The Guide can use..." rows="4"></textarea>
                <div class="dialog-actions">
                    <button id="response-save-btn" class="btn-primary">Save</button>
                    <button id="response-cancel-btn" class="btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
