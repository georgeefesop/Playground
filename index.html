<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>George Efesopoulos - Portfolio Playground</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <!-- Canvas for the world -->
    <canvas id="world-canvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-overlay">
        <!-- Settings Toggle Button -->
        <button id="settings-toggle-btn">⚙ Settings</button>

        <!-- Settings Panel -->
        <div id="settings-panel" class="hidden">
            <div class="settings-header">Settings</div>
            
            <div class="settings-section">
                <div class="settings-section-title">Background</div>
                <div class="background-library" id="background-library">
                    <!-- Backgrounds will be added dynamically -->
                </div>
            </div>

            <div class="settings-section">
                <div class="settings-section-title">Options</div>
                <div class="settings-option">
                    <label>Character Speed</label>
                    <input type="range" id="speed-slider" min="1" max="5" step="0.5" value="1.5">
                </div>
                <div class="settings-option">
                    <label>Zoom</label>
                    <input type="range" id="zoom-slider" min="0.5" max="2" step="0.1" value="1">
                </div>
                <div class="settings-option">
                    <div class="settings-toggle">
                        <input type="checkbox" id="grid-toggle" checked>
                        <label for="grid-toggle">Show Grid</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tutorial/Intro -->
        <div id="tutorial" class="ui-panel hidden">
            <div class="tutorial-content">
                <h2>Welcome to the Playground</h2>
                <p id="tutorial-text">Use <span id="controls-hint">arrow keys or WASD</span> to move around.</p>
                <p>Meet <strong>The Guide</strong> - he'll help you explore.</p>
                <button id="start-btn">Begin</button>
            </div>
        </div>

        <!-- Thought Bubble from The Guide -->
        <div id="guide-comment" class="hidden"></div>

        <!-- Message Prompt Dialog -->
        <div id="message-prompt" class="hidden">
            <div class="prompt-content">
                <h3>Message The Guide</h3>
                <input type="text" id="message-input" placeholder="Type your message..." autofocus>
                <div class="prompt-actions">
                    <button id="message-send-btn">Send</button>
                    <button id="message-cancel-btn">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
