<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Presets</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1a1f2e;
            color: #f5f5f0;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #4a90e2;
        }
        button {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            margin: 1rem 0;
        }
        button:hover {
            background: #357abd;
        }
        textarea {
            width: 100%;
            min-height: 400px;
            background: #2a2f3e;
            color: #f5f5f0;
            border: 2px solid #4a90e2;
            border-radius: 4px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            margin: 1rem 0;
        }
        .status {
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 4px;
        }
        .success {
            background: rgba(74, 144, 226, 0.2);
            border: 1px solid #4a90e2;
        }
        .error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
        }
        .info {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <h1>Export Star Presets</h1>
    <div class="info status">
        <p><strong>Instructions:</strong></p>
        <ol>
            <li>Make sure you've opened this file from the same directory where your game runs (or from the Playground folder)</li>
            <li>Click "Export Presets" below</li>
            <li>Copy the JSON from the textarea</li>
            <li>Send it to be added to <code>data/default-presets.json</code></li>
        </ol>
    </div>
    
    <button onclick="exportPresets()">Export Presets</button>
    <button onclick="copyToClipboard()">Copy to Clipboard</button>
    
    <div id="status"></div>
    
    <textarea id="output" readonly placeholder="Presets JSON will appear here..."></textarea>
    
    <script>
        function exportPresets() {
            try {
                const presetsJson = localStorage.getItem('starPresets');
                const statusDiv = document.getElementById('status');
                const output = document.getElementById('output');
                
                if (!presetsJson) {
                    statusDiv.innerHTML = '<div class="error status">No presets found in localStorage. Make sure you\'ve saved some presets in the game first.</div>';
                    output.value = '[]';
                    return;
                }
                
                const presets = JSON.parse(presetsJson);
                const json = JSON.stringify(presets, null, 2);
                
                output.value = json;
                statusDiv.innerHTML = `<div class="success status">Found ${presets.length} preset(s) exported successfully!</div>`;
            } catch (e) {
                const statusDiv = document.getElementById('status');
                statusDiv.innerHTML = `<div class="error status">Error exporting presets: ${e.message}</div>`;
                console.error('Error exporting presets:', e);
            }
        }
        
        function copyToClipboard() {
            const output = document.getElementById('output');
            if (!output.value || output.value === '[]') {
                alert('No presets to copy. Click "Export Presets" first.');
                return;
            }
            
            output.select();
            document.execCommand('copy');
            
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<div class="success status">Presets copied to clipboard!</div>';
        }
        
        // Auto-export on load
        window.addEventListener('load', () => {
            exportPresets();
        });
    </script>
</body>
</html>
